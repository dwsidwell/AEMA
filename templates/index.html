<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IamResponding Event Viewer</title>
    <!-- Use Inter font for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background-color: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-nav-outline {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-nav-outline:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header-title {
            text-align: left;
        }

        .header-title h1 {
            margin: 0 0 0.5rem 0;
        }

        .header-title p.subtitle {
            margin: 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 0.6rem 1.2rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-bottom: 0.25rem;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background: var(--surface-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.25);
        }

        .btn-success:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        .btn-success:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .status-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .status-loading {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .attendee-tag {
            display: inline-block;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            margin: 0.2rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .no-attendees {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }

        /* Response Buttons Styling */
        .btn-resp-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        
        .btn-resp-outline:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--text-muted);
        }

        .resp-attending {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .resp-not-attending {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .resp-not-sure {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Tiny spinner for buttons */
        .spinner-tiny {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--text-main);
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 4px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .flex-row {
            display: flex;
            gap: 1rem;
        }

        .flex-row .form-group {
            flex: 1;
        }

        @media (max-width: 600px) {
            .flex-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="navbar-brand">Volunteer Portal</a>
        <div class="navbar-user">
            <a href="/profile" class="btn-nav-outline">Profile</a>
            <a href="/" class="btn-nav-outline">Home</a>
            <a href="/logout" class="btn-nav-outline">Logout</a>
        </div>
    </nav>

<div class="container">
    <header class="dashboard-header">
        <div class="header-title">
            <h1>Event Viewer</h1>
            <p class="subtitle">Securely fetching your IamResponding events</p>
        </div>
        <a href="/" class="btn-back">&larr; Back to Portal</a>
    </header>

    <div class="card" id="loginCard">
        <form id="credentialsForm">
            <div class="flex-row" style="align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0; max-width: 200px;">
                    <label for="days">Days to Fetch</label>
                    <input type="number" id="days" value="10" min="1" max="365" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <button type="submit" class="btn-primary" id="fetchBtn" style="height: 46px; margin-top: 0; width: 150px;">Fetch Events</button>
                </div>
            </div>
        </form>

        <div id="statusMessage" class="status-message"></div>
    </div>



    <div class="table-container" id="resultsContainer">
        <table id="eventsTable">
            <thead>
                <tr>
                    <th width="20%">Event Start</th>
                    <th width="35%">Subject</th>
                    <th width="45%">Attendees (Response = 1)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be populated here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('credentialsForm');
        const daysInput = document.getElementById('days');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusMessage = document.getElementById('statusMessage');
        const resultsContainer = document.getElementById('resultsContainer');
        const tbody = document.querySelector('#eventsTable tbody');
        let lastUrls = [];
        let lastFetchedEvents = [];

        // Load saved days from local storage if any
        const savedDays = localStorage.getItem('iar_days');
        if (savedDays) {
            daysInput.value = savedDays;
        }

        // Automatically fetch events on load
        fetchEvents(daysInput.value);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const days = daysInput.value;
            localStorage.setItem('iar_days', days);
            fetchEvents(days);
        });

        function showStatus(type, message) {
            statusMessage.className = 'status-message';
            if (!type) {
                statusMessage.style.display = 'none';
                return;
            }
            
            statusMessage.classList.add(`status-${type}`);
            
            if (type === 'loading') {
                statusMessage.innerHTML = `<div class="spinner"></div> ${message}`;
            } else if (type === 'error' && (message.includes('update your IAR credentials') || message.includes('Missing credentials') || message.includes('Are credentials correct'))) {
                statusMessage.innerHTML = `You need to update your IAR credentials in <a href="/profile" style="color: #60a5fa; text-decoration: underline; font-weight: 600;">your profile</a>.`;
            } else {
                statusMessage.innerHTML = message;
            }
            
            statusMessage.style.display = type === 'loading' ? 'flex' : 'block';
        }

        async function fetchEvents(days) {
            showStatus('loading', 'Authenticating and fetching events... This may take a moment.');
            resultsContainer.style.display = 'none';
            lastUrls = [];
            fetchBtn.disabled = true;

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch events');
                }

                lastFetchedEvents = data.events;

                if (data.urls) {
                    lastUrls = data.urls;
                }

                // Store status change permission flag
                window.allowIarStatusChange = data.allow_iar_status_change !== false;

                renderTable(data.events);
                showStatus('', '');
            } catch (error) {
                window.location.href = '/profile?error=iar_failed';
            } finally {
                fetchBtn.disabled = false;
            }
        }


        // Helper to format date string
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const d = new Date(dateString);
                return d.toLocaleString(undefined, { 
                    weekday: 'short', 
                    year: 'numeric',
                    month: 'short', 
                    day: 'numeric', 
                    hour: 'numeric', 
                    minute: '2-digit'
                });
            } catch (e) {
                return dateString;
            }
        }

        // Helper to get attendee name
        function getAttendeeName(attendee) {
            // The JSON contains a nested 'member' object
            if (attendee.member) {
                if (attendee.member.name && attendee.member.lastName) {
                    return `${attendee.member.name} ${attendee.member.lastName}`;
                }
            }
            
            // Fallbacks just in case
            if (attendee.name && attendee.lastName) {
                return `${attendee.name} ${attendee.lastName}`;
            }
            if (attendee.firstName && attendee.lastName) {
                return `${attendee.firstName} ${attendee.lastName}`;
            }
            if (attendee.name) {
                return attendee.name;
            }
            
            // Fallback: Display the actual JSON so we can see exactly what fields exist
            return JSON.stringify(attendee).replace(/[{"}]/g, '').substring(0, 100);
        }


        function downloadICS(event) {
            const formatICSDate = (dateStr) => {
                if (!dateStr) return '';
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) throw new Error("invalid");
                    const str = d.toLocaleString('en-US', { timeZone: 'America/Chicago', hour12: false });
                    const [datePart, timePart] = str.split(', ');
                    let [month, day, year] = datePart.split('/');
                    let [hour, minute, second] = timePart.split(':');
                    month = month.padStart(2, '0');
                    day = day.padStart(2, '0');
                    hour = hour === '24' ? '00' : hour.padStart(2, '0');
                    return `${year}${month}${day}T${hour}${minute}${second}`;
                } catch(e) {
                    const cleaned = dateStr.replace(/[-:]/g, '').replace(/\..+/, '').replace(/Z$/, '');
                    return cleaned.length >= 15 ? cleaned.substring(0, 15) : cleaned;
                }
            };

            const start = formatICSDate(event.eventStart);
            const end = event.eventEnd ? formatICSDate(event.eventEnd) : start;
            const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            
            const escapeICS = (str) => {
                if (!str) return '';
                return str.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
            };

            const summary = escapeICS("EMA: " + (event.subject || 'Event'));
            const description = escapeICS(event.description || '');

            const icsContent = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//IamResponding Viewer//EN
CALSCALE:GREGORIAN
BEGIN:VEVENT
DTSTAMP:${now}
DTSTART:${start}
DTEND:${end}
SUMMARY:${summary}
DESCRIPTION:${description}
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            
            const fileName = `${(event.subject || 'event').replace(/[^a-zA-Z0-9]/g, '_')}.ics`;
            
            link.setAttribute('download', fileName);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function createGoogleCalendarUrl(event) {
            const formatGCalDate = (dateStr) => {
                if (!dateStr) return '';
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) throw new Error("invalid");
                    const str = d.toLocaleString('en-US', { timeZone: 'America/Chicago', hour12: false });
                    const [datePart, timePart] = str.split(', ');
                    let [month, day, year] = datePart.split('/');
                    let [hour, minute, second] = timePart.split(':');
                    month = month.padStart(2, '0');
                    day = day.padStart(2, '0');
                    hour = hour === '24' ? '00' : hour.padStart(2, '0');
                    return `${year}${month}${day}T${hour}${minute}${second}`;
                } catch(e) {
                    const cleaned = dateStr.replace(/[-:]/g, '').replace(/\..+/, '').replace(/Z$/, '');
                    return cleaned.length >= 15 ? cleaned.substring(0, 15) : cleaned;
                }
            };

            const start = formatGCalDate(event.eventStart);
            const end = event.eventEnd ? formatGCalDate(event.eventEnd) : start;
            
            const text = encodeURIComponent("EMA: " + (event.subject || 'Event'));
            const details = encodeURIComponent(event.description || '');
            
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}`;
        }



        function renderTable(events) {
            tbody.innerHTML = '';
            
            if (!events || events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 2rem; color: var(--text-muted);">No events found for the next ' + daysInput.value + ' days.</td></tr>';
                resultsContainer.style.display = 'block';
                return;
            }

            lastFetchedEvents = events;

            events.forEach(event => {
                const tr = document.createElement('tr');
                tr.id = `event-row-${event.id}`;
                populateEventRow(event, tr);
                tbody.appendChild(tr);
            });

            resultsContainer.style.display = 'block';
        }

        function populateEventRow(event, tr) {
            tr.innerHTML = '';
            
            // Highlight row if 0 attendees
            if (!event.attendees || event.attendees.length === 0) {
                tr.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                tr.style.borderLeft = '4px solid var(--error-color)';
            } else {
                tr.style.backgroundColor = '';
                tr.style.borderLeft = '';
            }
            
            // Event Start & End
            const tdStart = document.createElement('td');
            
            const startDiv = document.createElement('div');
            startDiv.style.fontSize = '0.8rem';
            startDiv.style.whiteSpace = 'nowrap';
            startDiv.innerHTML = `<strong>Start:</strong> ${formatDate(event.eventStart)}`;
            tdStart.appendChild(startDiv);
            
            if (event.eventEnd) {
                const endDiv = document.createElement('div');
                endDiv.style.fontSize = '0.8rem';
                endDiv.style.whiteSpace = 'nowrap';
                endDiv.style.marginTop = '0.3rem';
                endDiv.innerHTML = `<strong>End:</strong> ${formatDate(event.eventEnd)}`;
                tdStart.appendChild(endDiv);
            }

            const btnContainer = document.createElement('div');
            btnContainer.style.display = 'flex';
            btnContainer.style.flexDirection = 'row';
            btnContainer.style.flexWrap = 'wrap';
            btnContainer.style.gap = '0.4rem';
            btnContainer.style.marginTop = '0.75rem';

            const gCalBtn = document.createElement('a');
            gCalBtn.className = 'btn-secondary';
            gCalBtn.style.padding = '0.25rem 0.4rem';
            gCalBtn.style.fontSize = '0.7rem';
            gCalBtn.style.display = 'inline-flex';
            gCalBtn.style.alignItems = 'center';
            gCalBtn.style.gap = '4px';
            gCalBtn.style.textDecoration = 'none';
            gCalBtn.style.width = 'fit-content';
            gCalBtn.target = '_blank';
            gCalBtn.rel = 'noopener noreferrer';
            gCalBtn.href = createGoogleCalendarUrl(event);
            gCalBtn.title = 'Add to Google Calendar';
            gCalBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> Google`;

            const calBtn = document.createElement('button');
            calBtn.className = 'btn-secondary';
            calBtn.style.padding = '0.25rem 0.4rem';
            calBtn.style.fontSize = '0.7rem';
            calBtn.style.display = 'inline-flex';
            calBtn.style.alignItems = 'center';
            calBtn.style.gap = '4px';
            calBtn.style.width = 'fit-content';
            calBtn.title = 'Download .ics file';
            calBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> .ics`;
            
            calBtn.addEventListener('click', () => {
                downloadICS(event);
            });
            
            btnContainer.appendChild(gCalBtn);
            btnContainer.appendChild(calBtn);
            tdStart.appendChild(btnContainer);

            // Attendance Response buttons container
            const respContainer = document.createElement('div');
            respContainer.className = 'response-btn-container';
            respContainer.style.display = 'flex';
            respContainer.style.flexDirection = 'row';
            respContainer.style.gap = '0.3rem';
            respContainer.style.marginTop = '0.75rem';
            respContainer.style.borderTop = '1px solid var(--border-color)';
            respContainer.style.paddingTop = '0.75rem';
            
            const responses = [
                { value: 1, label: 'Attending', activeClass: 'resp-attending', defaultClass: 'btn-resp-outline' },
                { value: 2, label: 'Not Attending', activeClass: 'resp-not-attending', defaultClass: 'btn-resp-outline' },
                { value: 0, label: 'Not Sure', activeClass: 'resp-not-sure', defaultClass: 'btn-resp-outline' }
            ];
            
            const isFeatureDisabled = window.allowIarStatusChange === false;
            
            responses.forEach(resp => {
                const btn = document.createElement('button');
                btn.dataset.value = resp.value;
                btn.style.fontSize = '0.7rem';
                btn.style.padding = '0.3rem 0.5rem';
                btn.style.borderRadius = '6px';
                btn.style.fontWeight = '600';
                btn.style.flex = '1';
                btn.style.textAlign = 'center';
                btn.style.transition = 'all 0.2s ease';
                
                const isCurrent = event.user_response === resp.value;
                if (isCurrent) {
                    btn.className = resp.activeClass;
                    btn.disabled = true;
                    btn.style.cursor = 'default';
                    btn.innerHTML = `<span style="margin-right:2px;">✓</span> ${resp.label}`;
                } else {
                    btn.className = resp.defaultClass;
                    btn.textContent = resp.label;
                    
                    if (isFeatureDisabled) {
                        btn.disabled = true;
                        btn.style.cursor = 'not-allowed';
                        btn.style.opacity = '0.5';
                    } else {
                        btn.style.cursor = 'pointer';
                        btn.addEventListener('click', async () => {
                            const buttons = respContainer.querySelectorAll('button');
                            buttons.forEach(b => b.disabled = true);
                            
                            const originalText = btn.innerHTML;
                            btn.innerHTML = `<span class="spinner-tiny"></span> Saving...`;
                            
                            try {
                                const response = await fetch('/api/event/respond', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        eventId: event.id,
                                        recurrenceDate: event.recurrence_date,
                                        response: resp.value
                                    })
                                });
                                
                                const data = await response.json();
                                if (!response.ok) {
                                    throw new Error(data.error || 'Failed to update attendance');
                                }
                                
                                // In-place refresh of the single row!
                                if (data.event) {
                                    const idx = lastFetchedEvents.findIndex(e => e.id === event.id);
                                    if (idx !== -1) {
                                        lastFetchedEvents[idx] = data.event;
                                    }
                                    populateEventRow(data.event, tr);
                                } else {
                                    // Local fallback: update status locally so we don't rescrape all events
                                    event.user_response = resp.value;
                                    populateEventRow(event, tr);
                                }
                            } catch (err) {
                                alert('Error: ' + err.message);
                                btn.innerHTML = originalText;
                                buttons.forEach(b => {
                                    if (parseInt(b.dataset.value) !== event.user_response) {
                                        b.disabled = false;
                                    }
                                });
                            }
                        });
                    }
                }
                respContainer.appendChild(btn);
            });
            
            tdStart.appendChild(respContainer);
            
            if (isFeatureDisabled) {
                const note = document.createElement('div');
                note.style.fontSize = '0.75rem';
                note.style.color = 'var(--text-muted)';
                note.style.textAlign = 'center';
                note.style.marginTop = '0.4rem';
                note.style.fontStyle = 'italic';
                note.textContent = 'update attendance status in IAR';
                tdStart.appendChild(note);
            }
            tr.appendChild(tdStart);
            
            // Subject
            const tdSubject = document.createElement('td');
            const subjectText = document.createElement('strong');
            subjectText.textContent = event.subject || 'No Subject';
            tdSubject.appendChild(subjectText);
            if (event.description) {
                const desc = document.createElement('div');
                desc.style.fontSize = '0.85rem';
                desc.style.color = 'var(--text-muted)';
                desc.style.marginTop = '0.5rem';
                
                if (event.description.length > 100) {
                    const shortText = event.description.substring(0, 100) + '...';
                    desc.innerHTML = `<span>${shortText}</span> <a href="#" style="color: var(--primary-color); text-decoration: none; margin-left: 5px;" class="expand-btn">Read more</a>`;
                    
                    const expandBtn = desc.querySelector('.expand-btn');
                    expandBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (expandBtn.textContent === 'Read more') {
                            desc.firstElementChild.textContent = event.description;
                            expandBtn.textContent = ' Show less';
                        } else {
                            desc.firstElementChild.textContent = shortText;
                            expandBtn.textContent = 'Read more';
                        }
                    });
                } else {
                    desc.textContent = event.description;
                }
                tdSubject.appendChild(desc);
            }

            // Render document pills
            if (event.documents && event.documents.length > 0) {
                const docsContainer = document.createElement('div');
                docsContainer.className = 'event-docs-container';
                docsContainer.style.marginTop = '0.75rem';
                docsContainer.style.display = 'flex';
                docsContainer.style.flexWrap = 'wrap';
                docsContainer.style.gap = '0.5rem';
                
                event.documents.forEach(doc => {
                    const docPill = document.createElement('div');
                    docPill.style.display = 'inline-flex';
                    docPill.style.alignItems = 'center';
                    docPill.style.gap = '0.35rem';
                    docPill.style.backgroundColor = 'rgba(6, 182, 212, 0.08)';
                    docPill.style.border = '1px solid rgba(6, 182, 212, 0.2)';
                    docPill.style.borderRadius = '6px';
                    docPill.style.padding = '0.25rem 0.5rem';
                    docPill.style.fontSize = '0.8rem';
                    
                    const docLink = document.createElement('a');
                    docLink.href = `/api/event-document/${event.id}/${encodeURIComponent(doc.filename)}`;
                    docLink.target = '_blank';
                    docLink.rel = 'noopener noreferrer';
                    docLink.style.color = '#22d3ee';
                    docLink.style.textDecoration = 'none';
                    docLink.style.fontWeight = '500';
                    docLink.style.display = 'inline-flex';
                    docLink.style.alignItems = 'center';
                    docLink.style.gap = '0.25rem';
                    docLink.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #22d3ee; flex-shrink: 0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${doc.filename}</span>
                        <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: normal; margin-left: 2px;">(${doc.file_size})</span>
                    `;
                    docPill.appendChild(docLink);
                    
                    docsContainer.appendChild(docPill);
                });
                
                tdSubject.appendChild(docsContainer);
            }

            // Render link pills
            if (event.links && event.links.length > 0) {
                const linksContainer = document.createElement('div');
                linksContainer.className = 'event-links-container';
                linksContainer.style.marginTop = '0.75rem';
                linksContainer.style.display = 'flex';
                linksContainer.style.flexWrap = 'wrap';
                linksContainer.style.gap = '0.5rem';
                
                event.links.forEach(link => {
                    const linkPill = document.createElement('div');
                    linkPill.style.display = 'inline-flex';
                    linkPill.style.alignItems = 'center';
                    linkPill.style.gap = '0.35rem';
                    linkPill.style.backgroundColor = 'rgba(167, 139, 250, 0.08)';
                    linkPill.style.border = '1px solid rgba(167, 139, 250, 0.2)';
                    linkPill.style.borderRadius = '6px';
                    linkPill.style.padding = '0.25rem 0.5rem';
                    linkPill.style.fontSize = '0.8rem';
                    
                    const linkLink = document.createElement('a');
                    linkLink.href = link.url;
                    linkLink.target = '_blank';
                    linkLink.rel = 'noopener noreferrer';
                    linkLink.style.color = '#c084fc';
                    linkLink.style.textDecoration = 'none';
                    linkLink.style.fontWeight = '500';
                    linkLink.style.display = 'inline-flex';
                    linkLink.style.alignItems = 'center';
                    linkLink.style.gap = '0.25rem';
                    linkLink.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #c084fc; flex-shrink: 0;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        <span style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${link.description}</span>
                    `;
                    linkPill.appendChild(linkLink);
                    
                    const uploadedByStr = link.uploaded_by ? ` by ${link.uploaded_by}` : '';
                    const uploadedAtStr = link.uploaded_at ? ` on ${link.uploaded_at}` : '';
                    linkPill.title = `${link.url}${uploadedByStr}${uploadedAtStr}`;
                    
                    linksContainer.appendChild(linkPill);
                });
                
                tdSubject.appendChild(linksContainer);
            }
            tr.appendChild(tdSubject);

            // Attendees
            const tdAttendees = document.createElement('td');
            if (event.attendees && event.attendees.length > 0) {
                event.attendees.sort((a, b) => {
                    const nameA = (a.member && a.member.name) ? a.member.name.toLowerCase() : '';
                    const nameB = (b.member && b.member.name) ? b.member.name.toLowerCase() : '';
                    return nameA.localeCompare(nameB);
                });
                
                event.attendees.forEach(a => {
                    const fullName = getAttendeeName(a);
                    const span = document.createElement('span');
                    span.className = 'attendee-tag';
                    span.textContent = fullName;
                    span.title = JSON.stringify(a);
                    tdAttendees.appendChild(span);
                });
            } else {
                const none = document.createElement('div');
                none.className = 'no-attendees';
                none.textContent = 'No attending members';
                tdAttendees.appendChild(none);
            }
            tr.appendChild(tdAttendees);
        }

    });
</script>



</body>
</html>
